<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Command Center — Trimetime Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-dark: #020617;
    --card-bg: #0f172a;
    --accent: #38bdf8; /* Cyber Blue */
    --accent-glow: rgba(56, 189, 248, 0.15);
    --success: #10b981;
    --danger: #f43f5e;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.05);
    --glass: rgba(15, 23, 42, 0.8);
  }

  * { box-sizing: border-box; transition: all 0.2s ease; }
  body { 
    margin: 0; background: var(--bg-dark); color: var(--text-primary); 
    font-family: 'Inter', sans-serif; letter-spacing: -0.01em;
  }

  /* Navigation Command Bar */
  .nav-bar {
    position: sticky; top: 0; z-index: 100;
    background: var(--glass); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 30px; display: flex; align-items: center; justify-content: space-between;
  }
  .brand-group { display: flex; align-items: center; gap: 12px; }
  .brand-group i { color: var(--accent); font-size: 20px; text-shadow: 0 0 15px var(--accent); }
  .brand-name { font-weight: 800; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
  
  .user-view-btn {
    background: var(--accent); color: #000; border: none; padding: 8px 18px;
    border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer;
    text-transform: uppercase; display: flex; align-items: center; gap: 8px;
  }
  .user-view-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px var(--accent-glow); }

  .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; }

  /* KPI Grid */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .kpi-card {
    background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 12px;
    position: relative; overflow: hidden;
  }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); opacity: 0;
  }
  .kpi-card:hover::before { opacity: 1; }
  .kpi-label { color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .kpi-value { font-size: 32px; font-weight: 800; margin: 8px 0; font-family: 'JetBrains Mono', monospace; }
  .kpi-trend { font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .trend-up { color: var(--success); }

  /* Chart & Panel */
  .panel {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-bottom: 30px;
  }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .panel-title { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  
  canvas { width: 100% !important; height: 320px !important; }

  /* Filters */
  .toolbar {
    display: flex; gap: 12px; margin-bottom: 20px;
  }
  .search-input {
    flex: 1; background: #1e293b; border: 1px solid var(--border); color: #fff;
    padding: 12px 20px; border-radius: 8px; outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .filter-select {
    background: #1e293b; border: 1px solid var(--border); color: #fff;
    padding: 0 15px; border-radius: 8px; cursor: pointer;
  }

  /* List Table Mode */
  .booking-list { display: grid; gap: 12px; }
  .booking-item {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 24px; display: grid; grid-template-columns: 2fr 1fr 1.5fr 1fr auto;
    align-items: center; gap: 20px;
  }
  .booking-item:hover { background: #1e293b; }
  
  .salon-name { font-weight: 700; color: var(--accent); font-size: 15px; }
  .user-email { font-size: 12px; color: var(--text-muted); display: block; margin-top: 4px; }
  .service-tags { font-size: 12px; color: var(--text-muted); }
  
  .status-pill {
    font-size: 10px; font-weight: 800; padding: 5px 10px; border-radius: 5px;
    text-transform: uppercase; width: fit-content;
  }
  .status-pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
  .status-done { background: rgba(16, 185, 129, 0.1); color: var(--success); }

  .action-group { display: flex; gap: 8px; }
  .btn-icon {
    width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted); cursor: pointer;
    display: grid; place-items: center;
  }
  .btn-icon:hover { color: #fff; border-color: var(--text-muted); }
  .btn-icon.check:hover { color: var(--success); border-color: var(--success); }
  .btn-icon.del:hover { color: var(--danger); border-color: var(--danger); }

  @media (max-width: 1000px) {
    .booking-item { grid-template-columns: 1fr 1fr; gap: 15px; }
    .action-group { grid-column: span 2; justify-content: flex-end; }
  }
</style>
</head>

<body>

<nav class="nav-bar">
  <div class="brand-group">
    <i class="fa-solid fa-bolt-lightning"></i>
    <div class="brand-name">Trimetime Intelligence</div>
  </div>
  <button class="user-view-btn" onclick="location.href='dashboard.html'">
    <i class="fa-solid fa-user"></i> Client Interface
  </button>
</nav>

<div class="container">
  
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Volume</div>
      <div class="kpi-value" id="sTotal">0</div>
      <div class="kpi-trend trend-up"><i class="fa-solid fa-arrow-up"></i> 12% Growth</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Active Flow</div>
      <div class="kpi-value" id="sPending">0</div>
      <div class="kpi-trend" style="color:var(--accent)">Live Operations</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Total Net Revenue</div>
      <div class="kpi-value" id="sRevenue">₹0</div>
      <div class="kpi-trend trend-up"><i class="fa-solid fa-chart-line"></i> Global Earnings</div>
    </div>
    <div class="kpi-card" style="border-color: var(--accent);">
      <div class="kpi-label" style="color: var(--accent);">7-Day Velocity</div>
      <div class="kpi-value" id="s7Rev">₹0</div>
      <div class="kpi-trend trend-up">Current Sprint</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title"><i class="fa-solid fa-wave-square" style="color:var(--accent)"></i> Performance Matrix</div>
      <div class="kpi-label">14-Day Activity Loop</div>
    </div>
    <canvas id="chart"></canvas>
  </div>

  <div class="toolbar">
    <input id="search" class="search-input" placeholder="Search tokens, users, or salon locations...">
    <select id="filter" class="filter-select">
      <option value="all">Full Registry</option>
      <option value="pending">Awaiting Service</option>
      <option value="done">Completed Lifecycle</option>
    </select>
  </div>

  <div id="list" class="booking-list"></div>
  <div id="empty" class="empty" style="display:none; text-align: center; padding: 50px; opacity: 0.5;">
    <i class="fa-solid fa-database" style="font-size: 40px; margin-bottom: 10px;"></i>
    <p>Data Buffer Empty</p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let bookings = [];
let chartInstance = null;

function sync() {
  bookings = JSON.parse(localStorage.getItem("appointments") || "[]");
  render();
}

function calculateKPIs() {
  const total = bookings.length;
  const pending = bookings.filter(b => !b.completed).length;
  const revTotal = bookings.reduce((t, b) => t + Number(b.finalAmount || 0), 0);
  
  document.getElementById("sTotal").innerText = total;
  document.getElementById("sPending").innerText = pending;
  document.getElementById("sRevenue").innerText = "₹" + revTotal.toLocaleString();
  
  // Logic for 7-day rev
  const weekRev = bookings.filter(b => {
    const diff = (Date.now() - new Date(b.createdAt).getTime()) / 86400000;
    return diff <= 7;
  }).reduce((t, b) => t + Number(b.finalAmount || 0), 0);
  document.getElementById("s7Rev").innerText = "₹" + weekRev.toLocaleString();
}

function renderChart() {
  const labels = [...Array(14)].map((_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (13 - i));
    return d.toLocaleDateString('en-US', { day: 'numeric', month: 'short' });
  });

  const dailyData = labels.map((_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (13 - i));
    const dayStr = d.toISOString().split('T')[0];
    return bookings.filter(b => b.createdAt?.startsWith(dayStr)).length;
  });

  const ctx = document.getElementById('chart').getContext('2d');
  if(chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Booking Velocity',
        data: dailyData,
        borderColor: '#38bdf8',
        backgroundColor: 'rgba(56, 189, 248, 0.1)',
        fill: true,
        tension: 0.4,
        borderWidth: 3,
        pointRadius: 4,
        pointBackgroundColor: '#38bdf8'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
      }
    }
  });
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const f = document.getElementById("filter").value;
  const container = document.getElementById("list");
  
  let list = [...bookings].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  if(f === "pending") list = list.filter(b => !b.completed);
  if(f === "done") list = list.filter(b => b.completed);
  if(q) list = list.filter(b => b.salon.toLowerCase().includes(q) || b.userEmail?.toLowerCase().includes(q));

  container.innerHTML = "";
  document.getElementById("empty").style.display = list.length ? "none" : "block";

  list.forEach((b, originalIndex) => {
    const realIndex = bookings.findIndex(x => x.token === b.token);
    const item = document.createElement("div");
    item.className = "booking-item";
    item.innerHTML = `
      <div>
        <span class="salon-name">${b.salon}</span>
        <span class="user-email">${b.userEmail || 'guest_user'}</span>
      </div>
      <div class="service-tags"><i class="fa-regular fa-calendar"></i> ${b.date}</div>
      <div class="service-tags"><i class="fa-solid fa-tags"></i> ${b.services?.length || 0} services</div>
      <div class="status-pill ${b.completed ? 'status-done' : 'status-pending'}">
        ${b.completed ? 'Processed' : 'In Queue'}
      </div>
      <div class="action-group">
        <button class="btn-icon check" onclick="toggle(${realIndex})" title="Toggle Status">
          <i class="fa-solid ${b.completed ? 'fa-rotate-left' : 'fa-check'}"></i>
        </button>
        <button class="btn-icon del" onclick="del(${realIndex})" title="Purge Record">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
    `;
    container.appendChild(item);
  });

  calculateKPIs();
  renderChart();
}

window.toggle = (i) => {
  bookings[i].completed = !bookings[i].completed;
  localStorage.setItem("appointments", JSON.stringify(bookings));
  render();
};

window.del = (i) => {
  if(confirm("Permanently purge this record?")) {
    bookings.splice(i, 1);
    localStorage.setItem("appointments", JSON.stringify(bookings));
    render();
  }
};

document.getElementById("search").oninput = render;
document.getElementById("filter").onchange = render;

sync();
// Auto-refresh chart on window resize
window.addEventListener('resize', renderChart);
</script>
</body>
</html>
